[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quactlize"
version = "0.2.0"
description = "Canonical K-pack kernels and measured dispatch for PPU"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "numpy", "torch", "gguf"]

[tool.setuptools.packages.find]
include = ["quactlize*"]
exclude = ["third_party*", "tests*", "tools*", "reference*"]

[tool.setuptools.package-data]
quactlize = ["include/ppu_format_config.inc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["device: needs an explicitly selected PPU and a source-built runtime"]
