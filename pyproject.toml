# BUILD WITH --no-build-isolation. setup.py imports torch to get its C++ extension machinery, and torch is
# deliberately NOT listed in `requires`: an isolated build would then fetch a generic PyPI torch, and the extension
# would be compiled and ABI-linked against a torch that is not the one the PPU box runs. Requiring the already-installed
# torch is the point.
#
#     pip install --no-build-isolation -e .
#
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quactlize"
version = "0.1.0"
description = "Low-bit weight-only GEMM kernels for the T-Head PPU"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["tomli>=1.1.0; python_version < '3.11'"]

[project.optional-dependencies]
packer = ["gguf"]

[project.scripts]
quactlize-pack-gguf = "quactlize.pack_gguf:main"
quactlize-verify-ppu-bundle = "quactlize.ppu_bundle:main"

[tool.setuptools]
packages = ["quactlize"]

[tool.setuptools.package-data]
quactlize = [
  "include/ppu_format_config.inc",
  "include/quactlize_ppu_config.h",
  "include/quactlize_ppu_device.h",
  "include/quactlize_ppu_packed.h",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: instantiates C++ templates with nvcc (~20s) to re-run a measurement a design decision rests on",
  "device_vs_cpu_arm: compares the DEVICE arm against its own CPU reference arm on identical bytes. Skips when\nthere is no device, which is honest -- but run_batch.sh's pytest step treats a skip on a device box as a failure,\nbecause a skip there means the comparison the test exists for did not happen.",
  "fully_quantized_dense: exact FULLY_QUANTIZED/DENSE producer and launch oracles. A device run must execute\nthese tests rather than accept a skip, because a skip would leave the packed-dense path unchecked.",
  "kpack4_production: exact Q4 K-pack4 arrangement-v2 closure across dense decode, persistent prefill and ragged grouped/MoE; requires separate packed-format0 and non-packed device libraries.",
  "cpu_reference: needs gguf_vecdot's CPU REFERENCE ARM, which the device library displaces. These compare our\narithmetic against the official gguf package in the same summation order, at fp32; the device arm accumulates in\nfp16 in a different order, so running them against it compares two things neither test was written to compare.\nThey are not device tests and pointing them at the device is not a stricter version of them. Run with\nQUACTLIZE_PPU_LIB set to a nonexistent path so ppu_backend::load() fails deterministically; run_batch.sh's\npytest step does this as a separate pass.",
]
